spring.application.name=NexusWMS
spring.main.web-application-type=none
spring.main.banner-mode=off

# --- Database (all overridable via env vars; no credentials in source) ---
spring.datasource.url=jdbc:mysql://localhost:3306/nexus_wms?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=PASSWORD
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# --- JPA: schema.sql is authoritative, Hibernate only validates ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Schema runs on every start (idempotent). Seed is NOT listed here:
# --- SeedDataRunner executes database/seed.sql only when products is empty.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.continue-on-error=false

# --- AI (optional; rule-based fallback when disabled) ---
nexus.ai.enabled=${NEXUS_AI_ENABLED:false}
# provider: anthropic | openai
nexus.ai.provider=${NEXUS_AI_PROVIDER:anthropic}
nexus.ai.api-key=${NEXUS_AI_API_KEY:}
# blank = provider default (anthropic: claude-3-5-sonnet-latest, openai: gpt-4o-mini)
nexus.ai.model=${NEXUS_AI_MODEL:}
nexus.ai.timeout-seconds=${NEXUS_AI_TIMEOUT:45}
nexus.ai.max-tokens=${NEXUS_AI_MAX_TOKENS:1500}

# --- Voice (Vosk offline STT). Point to an unpacked model directory, e.g. vosk-model-small-en-us-0.15 ---
nexus.voice.model-path=${NEXUS_VOSK_MODEL_PATH:}
nexus.voice.max-seconds=${NEXUS_VOICE_MAX_SECONDS:8}

# --- UI ---
nexus.ui.theme=${NEXUS_UI_THEME:PrimerLight}

logging.config=classpath:logback-spring.xml
